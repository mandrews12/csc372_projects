<!-- This is the products page for Criter Heaven Crafts, showcasing the handmade products with detailed descriptions and purchase options. -->

<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="description" content="Criter Heaven Crafts - Unique handmade crafts and artisan products. Discover one-of-a-kind jewelry, home decor, and gifts crafted with care.">
        <meta property="og:title" content="Criter Heaven Crafts - Gallery">
        <meta property="og:description" content="Explore unique handmade crafts and artisan products at Criter Heaven Crafts. From jewelry to home decor, find the perfect gift crafted with love.">
        <meta property="og:image" content="documentation/logo.png">
        <meta property="og:url" content="https://criterheavencrafts.com/products.html">
        <meta property="og:type" content="website">

        <title>Criter Heaven Crafts - Shop</title> 
        <link rel="stylesheet" href="css/style.css">
    </head>


    <body>

        <!-- Header with Logo and Navigation -->
        <div class="header">
            <img src="documentation/logo.png" alt="Criter Heaven Crafts Logo" height="200">
            <nav>
                <a href="/index">Home</a>
                <a href="/about">About</a> 
                <a href="/products" class="active">Shop</a>
                <a href="/contact">Contact</a>
            </nav>
        </div>

        <div class = "card">

            <h1>Shop</h1>

            <!-- Category Sections -->
            <div id="cards" class="category">
                <div class="item" data-description="Assorted greeting cards with unique designs." data-stock="In Stock">
                    <img src="images/product_placeholder.png" alt="Assorted Cards" height="150">
                    <h3>Assorted Cards</h3>
                    <p>$10.00</p>
                    <button class="view-details">View Details</button>
                </div>
                <div class="item" data-description="Handmade papercraft items with intricate designs." data-stock="In Stock">
                    <img src="images/product_placeholder.png" alt="Papercraft Item" height="150">
                    <h3>Papercraft Item</h3>
                    <p>$15.00</p>
                    <button class="view-details">View Details</button>
                </div>
                <div class="item" data-description="Stunning alcohol ink flower artwork on canvas." data-stock="In Stock">
                    <img src="images/product_placeholder.png" alt="Alcohol Ink Flower" height="150">
                    <h3>Alcohol Ink Flower</h3>
                    <p>$30.00</p>
                    <button class="view-details">View Details</button>
                </div>
                <div class="item" data-description="Alcohol ink flower designs on decorative tiles." data-stock="In Stock">
                    <img src="images/product_placeholder.png" alt="Alcohol Ink Tile" height="150">
                    <h3>Alcohol Ink Tile</h3>
                    <p>$25.00</p>
                    <button class="view-details">View Details</button>
                </div>
                <div class="item" data-description="Elegant shadowbox displays for your cherished items." data-stock="In Stock">
                    <img src="images/product_placeholder.png" alt="Shadowbox" height="150">
                    <h3>Shadowbox</h3>
                    <p>$40.00</p>
                    <button class="view-details">View Details</button>
                </div>
                <div class="item" data-description="A beautiful handmade cardinal lantern, perfect for home decor." data-stock="In Stock">
                    <img src="images/product_placeholder.png" alt="Cardinal Lantern" height="150">
                    <h3>Cardinal Lantern</h3>
                    <p>$25.00</p>
                    <button class="view-details">View Details</button>
                </div>
            </div>
        </div>

        <!-- Product Modal that is called using JavaScript and is placeholders that will be dynamically filled with information -->
        <div id="product-modal" class="modal">
            <div class="modal-content">
                <span class="close"> x </span>
                <img id="modal-image" src="" alt="" height="300">
                <div class="text-content">
                    <h2 id="modal-title"></h2>
                    <p id="modal-price"></p>
                    <p id="modal-description"></p>
                    <p id="modal-stock"></p>
                    <button id="buy-now">Buy Now</button>
                    <button id="contact-seller">Contact Seller</button>
                </div>
            </div>
        </div>

        <!-- Footer Section - copyright and contact information-->
        <footer>
            <p> Forum -  About Us - <a href="mailto:charm_tails@yahoo.com"> Contact Us</a> </p>
            <p><em>2026 Criter Heaven Crafts. All rights reserved.</em></p>
        </footer>

        <script src="js/products.js"></script>

    </body>
</html>
